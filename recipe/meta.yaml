{% set name = "openldap" %}
{% set version = "2.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.openldap.org/software/download/OpenLDAP/{{ name }}-release/{{ name }}-{{ version }}.tgz
  sha256: aad731aa22118ff327b9b4ddfc4b6f18ef9476586205da88a532e90940b523d2

build:
  number: 0
  skip: true  # [not unix]
  run_exports:
    - {{ pin_subpackage('openldap', max_pin='x.x') }}

requirements:
  build:
    - gnuconfig
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - groff
  host:
    - libevent {{ libevent }}
    - libsodium {{ libsodium }}
    - openssl {{ openssl }}
    - cyrus-sasl {{ cyrus_sasl }}
  run:
    - openssl >=3
    - cyrus-sasl >=2.1.27

about:
  home: https://www.openldap.org
  license: OLDAP-2.8
  license_family: BSD
  license_file: LICENSE
  summary: >
    OpenLDAP Software is an open source implementation of the Lightweight Directory Access Protocol.
  description: >
    OpenLDAP Software is an open source implementation of the Lightweight Directory Access Protocol.
  doc_url: https://www.openldap.org/doc
  dev_url: https://www.openldap.org/software/repo.html

extra:
  recipe-maintainers:
    - mariusvniekerk
    - bollwyvl
    - chenghlee
